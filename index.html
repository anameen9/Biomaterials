<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبارات Dental Biomaterials</title>
<style>
:root{--bg:#e9e9e9;--c:rgba(255,255,255,.9);--t:#1a1212;--p:#b71c1c;--p2:#e53935;--ok:#d9f6df;--okb:#2e9e44;--bad:#fde2e2;--badb:#d93636;--br:#e3cfcf;--mut:#5d4a4a}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:transparent;color:var(--t);max-width:640px;margin:auto;padding:0 14px 30px}
header{position:relative;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;margin:0 -14px 16px;padding:26px 16px 22px;text-align:center;border-radius:0 0 26px 26px;box-shadow:0 6px 18px #b71c1c55}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;font-size:13px;opacity:.9}
.card{background:var(--c);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #1b23361a;border:1px solid var(--br)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;font:inherit;color:inherit;cursor:pointer;text-align:right;transition:transform .15s}
.sec:active{transform:scale(.98)}.sec b{font-size:16px;display:block}
.sec small{color:var(--mut);white-space:nowrap}.sec>span{flex:1}
.sec.w{border:2px solid var(--badb)}.sec.a{border:2px solid var(--p)}
.bar{height:7px;background:var(--br);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px;transition:width .3s}
button{font:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.top button{padding:9px 14px;border:1px solid var(--br);border-radius:10px;background:var(--c);color:var(--t)}
.q{direction:ltr;text-align:left;font-size:18px;font-weight:600;line-height:1.5;margin:12px 0}
.o{display:block;width:100%;direction:ltr;text-align:left;padding:13px 14px;margin:9px 0;border:2px solid var(--br);border-radius:12px;background:var(--c);color:var(--t);font-size:15.5px;transition:.15s}
.o:not(:disabled):active{border-color:var(--p)}
.o.ok{background:var(--ok);border-color:var(--okb)}.o.bad{background:var(--bad);border-color:var(--badb)}
.fb{margin-top:10px;font-weight:600}
.nav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px}
.nav>button{padding:12px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:600}
.nav>button:disabled{opacity:.35}
.nav input{width:76px;padding:11px;border:2px solid var(--br);border-radius:12px;text-align:center;background:var(--c);color:var(--t);font:inherit}
.rs{background:#c0392b!important;color:#fff;border:0;margin-top:16px;width:100%;font-weight:600;cursor:pointer}
.msg{text-align:center;padding:28px}
footer{text-align:center;margin-top:26px;color:var(--mut);font-size:13px}
#md{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
#md.on{display:flex}
#md .bx{background:var(--c);border-radius:22px;padding:24px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px #0006;animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#md .d{font-size:23px;line-height:2;color:var(--p);font-family:"Amiri","Traditional Arabic",serif;font-weight:700}
#md .s{font-size:19px;margin:14px 0 18px;font-weight:700}
#md button{padding:12px 34px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:16px;font-weight:600}

.sal{position:absolute;top:10px;right:16px;font-family:"Amiri","Traditional Arabic",serif;font-size:14px;font-weight:700;opacity:.95}
.lg{width:96px;height:96px;margin:6px auto 10px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0004;overflow:hidden}
.lg img{width:100%;height:100%;object-fit:cover;padding:0}
.lg b{color:#b71c1c;font-size:13px;line-height:1.5;text-align:center}
.tm{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.tm span{font-weight:700;font-variant-numeric:tabular-nums;min-width:78px;direction:ltr;color:var(--p)}
.tm span.low{color:var(--badb);animation:bl 1s infinite}
.tbar{flex:1;height:8px;background:var(--br);border-radius:9px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f9a825,#e53935);border-radius:9px;transition:width 1s linear}
@keyframes bl{50%{opacity:.35}}
.pty{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.pty i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(540deg)}}
.res{text-align:center;padding:26px 16px}
.res .pc{font-size:58px;font-weight:800;color:var(--p)}
.res .rm{font-size:19px;font-weight:700;margin:6px 0 16px}
.rg{display:flex;gap:8px;margin-bottom:10px}
.rg .g{flex:1;padding:12px 4px;border-radius:12px;border:1px solid var(--br)}
.rg .g b{display:block;font-size:24px}
.rg .g.ok{background:var(--ok);border-color:var(--okb)}.rg .g.bad{background:var(--bad);border-color:var(--badb)}
.rb{display:block;width:100%;padding:13px;margin-top:10px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:600}

html{background:#e9e9e9}
